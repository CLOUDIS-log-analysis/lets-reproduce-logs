services:
  mongod:
    image: mongo:8.0.15
    container_name: server-82688-mongod
    restart: "no"

    ports:
      - "27088:27017"

    ulimits:
      nofile:
        soft: 4096
        hard: 4096

    volumes:
      - ./data:/data/db
      - ./logs:/var/log/mongodb

    command:
      - mongod
      - --bind_ip_all
      - --port
      - "27017"
      - --dbpath
      - /data/db
      - --logpath
      - /var/log/mongodb/mongod.log
      - --logappend
      - --replSet
      - rs82688
      - --oplogSize
      - "128"
      - --maxConns
      - "400"
      - --wiredTigerEngineConfigString
      - session_max=120
      - --setParameter
      - logLevel=5
      - --setParameter
      - transactionLifetimeLimitSeconds=300

  load:
    image: python:3.12-slim
    restart: "no"

    depends_on:
      - mongod

    working_dir: /work

    volumes:
      - ./repro.py:/work/repro.py:ro

    environment:
      MONGODB_URI: mongodb://mongod:27017/?replicaSet=rs82688
      WORKERS: "180"
      HOLD_SECONDS: "90"
      PYTHONUNBUFFERED: "1"

    command:
      - /bin/sh
      - -c
      - pip install --no-cache-dir pymongo==4.10.1 && python /work/repro.py