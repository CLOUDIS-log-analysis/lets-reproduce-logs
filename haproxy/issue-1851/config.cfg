global
    log stdout format raw local0 debug

    pidfile /var/run/haproxy.pid

    maxconn 500000
    tune.bufsize 16384

    user sshkgw
    group users

    daemon

    set-dumpable

    nbthread 4
    cpu-map 1/all 0-

    tune.ssl.cachesize 400000
    tune.ssl.lifetime 86000
    tune.ssl.maxrecord 2859
    tune.ssl.default-dh-param 2048

    tune.h2.header-table-size 8192

    ssl-default-bind-options no-sslv3
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    log global

    option httplog
    option http-ignore-probes
    option dontlognull
    option log-separate-errors
    option log-health-checks
    option redispatch
    option tcp-smart-accept
    option tcp-smart-connect
    option abortonclose
    option forwardfor except 127.0.0.1

    retries 3

    timeout http-request 10s
    timeout client 10s
    timeout server 30s
    timeout connect 3s
    timeout check 1s
    timeout queue 10s
    timeout http-keep-alive 100s

frontend HTTPS
    bind *:30443 ssl crt-list /home/sshkgw/repo/lets-reproduce-logs/haproxy/issue-1851/ssl/cert-list.txt tls-ticket-keys /home/sshkgw/repo/lets-reproduce-logs/haproxy/issue-1851/ssl/tls-ticket.key alpn h2

    bind quic4@:30443 ssl crt-list /home/sshkgw/repo/lets-reproduce-logs/haproxy/issue-1851/ssl/cert-list.txt tls-ticket-keys /home/sshkgw/repo/lets-reproduce-logs/haproxy/issue-1851/ssl/tls-ticket.key alpn h3

    http-response set-header alt-svc "h3=\":30443\";ma=900;"

    default_backend BACKEND_POOL

backend BACKEND_POOL
    http-reuse safe

    server backend 127.0.0.1:8080 check
