services:
  redis-frag:
    image: redis:4.0.1
    container_name: redis-4356-test
    volumes:
      - ./log:/var/log/redis
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --loglevel debug --logfile /var/log/redis/baseline.log
    deploy:
      resources:
        limits:
          memory: 200M
