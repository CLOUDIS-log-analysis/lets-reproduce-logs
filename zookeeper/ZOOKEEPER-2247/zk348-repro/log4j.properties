# ZooKeeper application logging for experiment capture.
#
# No CONSOLE appender is attached:
#   - ZooKeeper application logs are written to /logs/zookeeper.log
#   - process stdout/stderr are captured separately as /logs/zookeeper.out
#
# FILE is intentionally a non-rolling FileAppender so an experiment does not
# discard older application-log records because of rotation limits.

zookeeper.root.logger=DEBUG, FILE
zookeeper.log.dir=/logs
zookeeper.log.file=zookeeper.log
zookeeper.log.threshold=DEBUG

log4j.rootLogger=${zookeeper.root.logger}

log4j.appender.FILE=org.apache.log4j.FileAppender
log4j.appender.FILE.Threshold=${zookeeper.log.threshold}
log4j.appender.FILE.File=${zookeeper.log.dir}/${zookeeper.log.file}
log4j.appender.FILE.Append=true
log4j.appender.FILE.ImmediateFlush=true

log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{ISO8601} [myid:%X{myid}] - %-5p [%t:%C{1}@%L] - %m%n
